[package]
name = "harn"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "List the effective harness an AI coding agent loads in a directory, with origin, cost and the official off switch"
repository = "https://github.com/2lab-ai/harn"

[[bin]]
name = "harn"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.102"
clap = { version = "4.6.1", features = ["derive", "string", "wrap_help"] }
clap_complete = "4.6.5"
# The bare `harn` on a terminal: llmux pins (research/03 §B house stack).
crossterm = { version = "0.29.0", features = ["event-stream"] }
dirs = "6.0.0"
ratatui = "0.30.1"
# Codex hook matchers are `regex` patterns (codex-rs `hooks/Cargo.toml`, workspace `regex = "1.12.3"`).
regex = "1.12.3"
# Codex plugin versions are ordered with the crate codex uses (core-plugin-common/src/installed.rs:40-45).
semver = "1.0.27"
serde = { version = "1.0.228", features = ["derive"] }
# preserve_order: settings JSON is rewritten in its original key order (02-architecture §Stack).
serde_json = { version = "1.0.150", features = ["preserve_order"] }
# Codex reads a skill's agents/openai.yaml with serde_yaml (ext/skills/src/loader/metadata.rs:130);
# harn uses the same crate so comments, flow style and type errors read the same way.
serde_yaml = "0.9.34"
sha2 = "0.10.9"
# SIGINT/SIGTERM/SIGHUP become a flag the view polls, so the terminal is restored on the way out.
signal-hook = "0.3.18"
similar = "2.7.0"
# Terminal width when stdout is a TTY and COLUMNS is unset or 0 (the first screen fits it).
terminal_size = "0.4.4"
time = { version = "0.3.47", features = ["formatting"] }
toml_edit = "0.25.12"
# Pane wrapping by terminal columns on grapheme boundaries; both already in the tree via ratatui.
unicode-segmentation = "1.13.3"
unicode-width = "0.2.2"
walkdir = "2.5.0"
